<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PDE Notes</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.0.0/lib/index.umd.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-size: 2rem !important;
    }

    .markdown-body {
      box-sizing: border-box;
      max-width: 980px;
      margin: 0 auto;
      padding: clamp(16px, 5vw, 60px);
      color: #c9d1d9;
    }

    .markdown-body a {
      color: #58a6ff;
    }

    /* Callout Styles */
    .callout {
      padding: 16px;
      margin: 16px 0;
      border-left: 6px solid;
      border-radius: 4px;
      color: #c9d1d9;
    }

    .callout strong {
      color: #ffffff !important;
    }

    .callout-note {
      border-left-color: #58a6ff;
      background: rgba(88, 166, 255, 0.1);
    }

    .callout-tip {
      border-left-color: #3fb950;
      background: rgba(63, 185, 80, 0.1);
    }

    .callout-caution {
      border-left-color: #f85149;
      background: rgba(248, 81, 73, 0.1);
    }

    .callout-important {
      border-left-color: purple;
      background: rgb(43, 0, 43);
    }

    .callout-warning {
      border-left-color: rgb(255, 51, 0);
      background: rgb(63, 41, 0);
    }

    /* Accordion Styles */
    details {
      overflow: hidden;
      margin-top: 20px;
    }

    details>div {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }

    details[open]>div {
      max-height: 2000px;
      opacity: 1;
    }

    summary {
      cursor: pointer;
      list-style: none;
      padding: 10px 40px 10px 10px;
      background: #161b22;
      border-radius: 6px;
      position: relative;
      transition: background 0.2s;
    }

    summary:hover {
      background: #21262d;
    }

    .summary-arrow {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 0.8em;
      color: #58a6ff;
      pointer-events: none;
      transition: transform 0.3s;
    }

    details[open] .summary-arrow {
      transform: rotate(180deg);
    }

    /* TOC Styles */
    #toc {
      margin-bottom: 40px;
    }

    #toc ul {
      list-style-type: none;
      padding-left: 0;
    }

    #toc a {
      cursor: pointer;
      color: #58a6ff;
      text-decoration: none;
    }

    #toc a:hover {
      text-decoration: underline;
      color: #ffffff;
    }
  </style>
</head>

<body class="markdown-body">
  <h1 id="page-title"></h1>
  <div id="toc"></div>
  <div id="content">Loading notes...</div>

  <script>
    fetch('notes.md')
      .then(r => r.text())
      .then(src => {
        // Register extension with 'raw' property required by marked
        marked.use({
          extensions: [{
            name: 'callout',
            level: 'block',
            start(s) { return s.indexOf('> [!'); },
            tokenizer(s) {
              const match = /^> ?\[!(NOTE|TIP|CAUTION|IMPORTANT|WARNING)\]\n((?:> ?.*\n?)*)/.exec(s);
              if (match) {
                return {
                  type: 'callout',
                  raw: match[0], // IMPORTANT: marked needs this to track the token
                  style: match[1],
                  text: match[2].replace(/^> ?/gm, '')
                };
              }
            },
            renderer(t) {
              return `<div class="callout callout-${t.style.toLowerCase()}">${marked.parse(t.text)}</div>`;
            }
          }]
        });

        const content = document.getElementById('content');
        content.innerHTML = DOMPurify.sanitize(marked.parse(src));

        // Handle Title
        const h1 = content.querySelector('h1');
        if (h1) { document.getElementById('page-title').innerText = h1.innerText; h1.remove(); }

        // Create Accordion
        content.querySelectorAll('h2').forEach((h2) => {
          const d = document.createElement('details');
          const s = document.createElement('summary');
          const w = document.createElement('div');
          s.innerHTML = `<span class="summary-title">${h2.outerHTML}</span><span class="summary-arrow">▼</span>`;
          let next = h2.nextElementSibling;
          while (next && next.tagName !== 'H2') {
            w.appendChild(next);
            next = h2.nextElementSibling;
          }
          d.append(s, w);
          h2.replaceWith(d);
        });

        // Build TOC
        const headers = content.querySelectorAll('h2, h3');
        if (headers.length > 0) {
          const toc = document.getElementById('toc');
          toc.innerHTML = '<h2>Contents</h2><ul></ul>';
          const ul = toc.querySelector('ul');
          headers.forEach((h, i) => {
            h.id = 'h-' + i;
            const li = document.createElement('li');
            li.style.marginLeft = (h.tagName === 'H3' ? '40px' : '0px');
            li.innerHTML = `<a href="#h-${i}">${h.innerText}</a>`;
            li.querySelector('a').onclick = () => { const d = h.closest('details'); if (d) d.open = true; };
            ul.appendChild(li);
          });
        }

        renderMathInElement(content, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
      });
  </script>
</body>

</html>

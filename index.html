<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PDE Notes</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <style>
    /* Dark Mode Defaults */
    body {
      background-color: #0d1117;
      color: #c9d1d9;
    }

    .markdown-body {
      box-sizing: border-box;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
      color: #c9d1d9;
    }

    /* Dark Mode Callout Styling */
    .callout {
      padding: 16px;
      margin: 16px 0;
      border-left: 6px solid;
      border-radius: 4px;
    }

    .callout-note {
      border-left-color: #58a6ff;
      background-color: rgba(88, 166, 255, 0.1);
    }

    .callout-tip {
      border-left-color: #3fb950;
      background-color: rgba(63, 185, 80, 0.1);
    }

    .callout-caution {
      border-left-color: #f85149;
      background-color: rgba(248, 81, 73, 0.1);
    }

    .callout-important {
      border-left-color: purple;
      background-color: rgb(43, 0, 43);
    }

    .callout-warning {
      border-left-color: rgb(255, 94, 0);
      background-color: rgb(63, 41, 0);
    }

    /* Ensure text in callouts is readable */
    .callout strong {
      color: #ffffff;
    }

    /* Optional: Override link colors for better dark mode visibility */
    .markdown-body a {
      color: #58a6ff;
    }

    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 1em 0;
      /* Ensures scrollbars don't clip the math */
    }
  </style>
</head>

<body class="markdown-body">
  <div id="content">Loading notes...</div>

  <script>
    // 1. Define the renderer
    const renderer = {
      blockquote(quote) {
        // Clean up the text by removing the markers so they don't appear in the UI
        const cleanQuote = quote.replace(/\[!(NOTE|TIP|CAUTION|IMPORTANT|WARNING)\]/g, '');

        if (quote.includes('[!NOTE]')) return `<div class="callout callout-note"><strong>Note</strong>${cleanQuote}</div>`;
        if (quote.includes('[!TIP]')) return `<div class="callout callout-tip"><strong>Tip</strong>${cleanQuote}</div>`;
        if (quote.includes('[!CAUTION]')) return `<div class="callout callout-caution"><strong>Caution</strong>${cleanQuote}</div>`;
        if (quote.includes('[!IMPORTANT]')) return `<div class="callout callout-important"><strong>Note</strong>${cleanQuote}</div>`;
        if (quote.includes('[!WARNING]')) return `<div class="callout callout-warning"><strong>Note</strong>${cleanQuote}</div>`;

        return `<blockquote>${quote}</blockquote>`;
      }
    };

    // 2. Apply renderer to marked
    marked.use({ renderer });

    // 3. Fetch and render
    fetch('notes.md')
      .then(response => response.text())
      .then(markdownSource => {
        const contentDiv = document.getElementById('content');

        // Parse and sanitize
        contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(markdownSource));

        // Trigger KaTeX
        renderMathInElement(contentDiv, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      })
      .catch(err => {
        document.getElementById('content').innerText = "Error loading notes.md.";
      });
  </script>

</body>

</html>
